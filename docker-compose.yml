# Lokale Entwicklung.
#   npm run db:up                      → Postgres + S3-Emulator (App läuft per `npm run dev` auf dem Host)
#                                        Der Emulator ist nur für den S3-Test und optionalen S3-Betrieb nötig.
#   docker compose --profile full up   → Postgres + App als Produktions-Container auf http://localhost:3000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comatch
      POSTGRES_PASSWORD: comatch
      POSTGRES_DB: comatch
    ports:
      # Host-Port 54340, damit eine lokal laufende Postgres-Instanz nicht kollidiert.
      - "54340:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comatch -d comatch"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-kompatibler Speicher, lokal statt Hetzner Object Storage (für den S3-Test; Selfies liegen sonst in Postgres).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: comatch
      RUSTFS_SECRET_KEY: comatch-dev-secret
    ports:
      - "9040:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    profiles: ["full"]
    build: .
    # Stürzt der Prozess ab, startet Docker ihn neu; laufende Runden setzt er aus der DB fort.
    restart: unless-stopped
    # Zeit für das saubere Herunterfahren (laufende DB-Arbeit abwarten).
    stop_grace_period: 15s
    environment:
      DATABASE_URL: postgres://comatch:comatch@postgres:5432/comatch
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-3000}
      # Lokal ohne HTTPS; in Produktion hinter Caddy bleibt das Cookie "Secure".
      COOKIE_SECURE: "false"
    ports:
      # Host-Port per APP_PORT änderbar, falls 3000 belegt ist.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
